<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e7efe8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>단어장</title>
<style>
  :root {
    --bg: #eef3ec;
    --bg-strong: #e0e8dc;
    --paper: #fffdfb;
    --paper-strong: #f5f0ea;
    --ink: #1d2a24;
    --ink-soft: #53635b;
    --muted: #6e7b73;
    --line: #dfe9df;
    --accent: #2d6a4f;
    --accent-strong: #1d4d3a;
    --accent-soft: #eaf3ee;
    --gold: #b7772a;
    --gold-soft: #f9f1e7;
    --shadow: rgba(27, 51, 39, 0.12);
    --shadow-strong: rgba(27, 51, 39, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at top left, rgba(45, 106, 79, 0.11), transparent 30%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-strong) 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; font-size: 16px; }
  button, select, input { touch-action: manipulation; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: .38; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .app {
    width: min(560px, 100%);
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 0 0 8px;
  }
  header {
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 2px;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.2rem, 2.6vw, 1.7rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--ink);
  }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: end;
    margin-top: 14px;
  }
  .toolbar-compact {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    margin-top: 10px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .field label {
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.09em;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 700;
  }
  .field-wide { flex: 1 1 180px; }
  #dataset,
  #previewPosition,
  #progressPosition,
  #startIndex {
    width: 100%;
    border: 1px solid rgba(45, 106, 79, 0.16);
    background: rgba(255, 253, 251, 0.9);
    border-radius: 14px;
    min-height: 46px;
    padding: 10px 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  #dataset:focus,
  #previewPosition:focus,
  #progressPosition:focus,
  #startIndex:focus {
    border-color: rgba(45, 106, 79, 0.45);
    box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.08);
  }
  #startIndex {
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #load {
    border: 0;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
    color: #f4fbf6;
    border-radius: 14px;
    min-height: 46px;
    padding: 9px 16px;
    min-width: 96px;
    font-weight: 700;
    box-shadow: 0 10px 18px rgba(29, 77, 58, 0.2);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #load:active { transform: translateY(1px); }
  .toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .toggle {
    border: 1px solid rgba(45, 106, 79, 0.14);
    background: rgba(255,255,255,0.44);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 7px 12px;
    min-height: 36px;
    font-weight: 600;
    transition: all .15s ease;
  }
  .toggle[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
    border-color: transparent;
    color: #f5fdf7;
    box-shadow: 0 6px 12px rgba(29, 77, 58, 0.16);
  }
  .mini-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .action {
    border: 1px solid rgba(45, 106, 79, 0.12);
    background: rgba(255,255,255,0.42);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 7px 12px;
    min-height: 36px;
    font-weight: 600;
  }
  .action[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--gold) 0%, #a6671d 100%);
    border-color: transparent;
    color: #fffaf5;
    box-shadow: 0 6px 12px rgba(183, 119, 42, 0.18);
  }
  .legend {
    margin: 10px 0 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: -0.01em;
  }
  .prog {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.38);
    border: 1px solid rgba(45, 106, 79, 0.08);
    border-radius: 16px;
  }
  .prog.hidden { display: none; }
  .pos {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 62px;
  }
  .track {
    flex: 1;
    height: 8px;
    background: rgba(95, 116, 105, 0.14);
    border-radius: 99px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
  }
  .fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent) 0%, #76b08f 100%);
    border-radius: inherit;
    transition: width .2s ease;
  }
  .nav-preview {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 16px 10px;
  }
  .nav-silhouette {
    min-height: 30px;
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(45, 106, 79, 0.05);
    color: rgba(29, 42, 36, 0.5);
    border: 1px solid rgba(45, 106, 79, 0.08);
    font-size: 12px;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-silhouette strong {
    color: rgba(29, 42, 36, 0.74);
    font-weight: 700;
  }
  .nav-preview.hidden { display: none; }
  #status {
    margin: 10px 0 0;
    font-size: 13px;
    color: #9b4a3a;
    font-weight: 600;
    min-height: 1.2em;
  }
  #status:empty { display: none; }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    padding: 6px 16px 8px;
    touch-action: pan-y;
  }
  #card {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.9));
    border: 1px solid rgba(45, 106, 79, 0.08);
    border-radius: 28px;
    box-shadow: 0 18px 34px var(--shadow), 0 6px 18px rgba(15, 18, 20, 0.05);
    overscroll-behavior: contain;
  }
  main.dragging { user-select: none; }
  .meta-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 12px;
    padding: 18px 22px 0;
  }
  .meta-badge {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.08em;
    font-weight: 800;
    border: 1px solid transparent;
    text-transform: uppercase;
  }
  .meta-badge.learned {
    background: rgba(45, 106, 79, 0.08);
    border-color: rgba(45, 106, 79, 0.12);
    color: var(--accent);
  }
  .meta-badge.bookmark {
    background: rgba(183, 119, 42, 0.08);
    border-color: rgba(183, 119, 42, 0.15);
    color: var(--gold);
  }
  .block {
    padding: 18px 22px 20px;
  }
  .block + .block { border-top: 1px solid var(--line); }
  .kicker {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 800;
  }
  .word {
    margin: 0;
    font-size: clamp(2.1rem, 9vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 1.1;
    overflow-wrap: anywhere;
    color: var(--ink);
  }
  .forms {
    margin: 8px 0 0;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.45;
    letter-spacing: -0.01em;
  }
  .def { font-size: 19px; line-height: 1.5; color: var(--ink); }
  .def.big { margin: 0; font-size: clamp(1.5rem, 5vw, 2rem); letter-spacing: -0.03em; }
  .mean-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .mean-list li { display: flex; flex-direction: column; gap: 4px; }
  .form {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
    font-weight: 700;
  }
  .exp, .ex, .empty, .loading { margin: 0; font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; color: var(--ink); }
  .exp + .exp, .ex + .ex { margin-top: 10px; }
  .ex {
    padding-left: 12px;
    border-left: 3px solid rgba(45, 106, 79, 0.45);
    color: var(--ink-soft);
  }
  .empty, .loading {
    color: var(--muted);
  }
  .loading, .done, .error { padding: 28px 22px; }
  .cover {
    display: block;
    width: 100%;
    text-align: left;
    background: linear-gradient(180deg, rgba(45, 106, 79, 0.025), rgba(45, 106, 79, 0.01));
    border: 1px dashed rgba(45, 106, 79, 0.18);
    border-radius: 18px;
    min-height: 90px;
    margin: 0 22px 18px;
    padding: 18px 20px;
    width: calc(100% - 44px);
    transition: background .15s ease, transform .15s ease;
  }
  .cover .hint {
    display: block;
    margin-top: 6px;
    font-size: 15px;
    color: var(--accent);
    font-weight: 700;
  }
  .cover:active { background: rgba(45, 106, 79, 0.05); }
  footer {
    display: flex;
    gap: 10px;
    padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .nav {
    height: 54px;
    border-radius: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #prev {
    flex: 1;
    background: rgba(255,255,255,0.8);
    border: 1px solid rgba(45, 106, 79, 0.12);
    color: var(--ink);
    box-shadow: 0 4px 10px rgba(20, 28, 26, 0.04);
  }
  #next {
    flex: 1.6;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
    color: #f4fff8;
    border: 0;
    box-shadow: 0 12px 22px rgba(29, 77, 58, 0.18);
  }
  .nav:active { transform: translateY(1px); }
  .from-right { animation: from-right .22s ease; }
  .from-left { animation: from-left .22s ease; }
  @keyframes from-right {
    from { transform: translateX(28px); opacity: .38; }
    to { transform: none; opacity: 1; }
  }
  @keyframes from-left {
    from { transform: translateX(-28px); opacity: .38; }
    to { transform: none; opacity: 1; }
  }
  @media (max-width: 460px) {
    .toolbar {
      grid-template-columns: 1fr;
    }
    .toolbar-compact {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .field { min-width: 0; }
    .nav-preview {
      grid-template-columns: 1fr;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .from-right, .from-left { animation: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="top">
        <h1>단어장</h1>
      </div>

      <div class="toolbar">
        <div class="field field-wide">
          <label for="dataset">문제집</label>
          <select id="dataset" aria-label="학습 세트 선택"></select>
        </div>
        <button type="button" id="load">불러오기</button>
      </div>

      <div class="toolbar toolbar-compact">
        <div class="field">
          <label for="startIndex">시작</label>
          <input id="startIndex" type="number" min="0" step="1" value="0" aria-label="시작 인덱스">
        </div>
        <div class="field">
          <label for="previewPosition">미리보기</label>
          <select id="previewPosition" aria-label="미리보기 위치 선택">
            <option value="top">위</option>
            <option value="bottom">아래</option>
            <option value="hidden">숨김</option>
          </select>
        </div>
        <div class="field">
          <label for="progressPosition">진행</label>
          <select id="progressPosition" aria-label="진행 표시 위치 선택">
            <option value="top">위</option>
            <option value="bottom">아래</option>
            <option value="hidden">숨김</option>
          </select>
        </div>
      </div>

      <div class="toggles" id="toggles">
        <button type="button" class="toggle" data-toggle="word">단어</button>
        <button type="button" class="toggle" data-toggle="mean">뜻</button>
        <button type="button" class="toggle" data-toggle="exp">설명</button>
        <button type="button" class="toggle" data-toggle="ex">예문</button>
        <button type="button" class="toggle" data-toggle="sound">소리</button>
      </div>
      <div class="mini-actions">
        <button type="button" class="action" id="toggleLearned" aria-pressed="false">외움 표시</button>
        <button type="button" class="action" id="toggleBookmark" aria-pressed="false">북마크</button>
      </div>
      <p class="legend">켠 항목은 항상 표시 · 끈 항목은 눜러서 확인</p>
      <div class="prog" id="prog">
        <span class="pos" id="pos">0 / 0</span>
        <div class="track" id="bar" role="progressbar" aria-valuemin="0" aria-valuenow="0" aria-valuemax="0" aria-label="진행">
          <div class="fill" id="fill"></div>
        </div>
      </div>
      <p id="status" role="status"></p>
    </header>
    <div class="nav-preview" id="navPreview" aria-live="polite">
      <div class="nav-silhouette" id="prevSilhouette"><strong>이전</strong> ·</div>
      <div class="nav-silhouette" id="nextSilhouette"><strong>다음</strong> ·</div>
    </div>
    <main id="stage">
      <article id="card"><p class="loading">불러오는 중…</p></article>
    </main>
    <footer>
      <button type="button" class="nav" id="prev" disabled>이전</button>
      <button type="button" class="nav" id="next" disabled>다음</button>
    </footer>
  </div>
<script>
const FIELDS = ["word", "mean", "exp", "ex"];
const LABELS = { word: "단어", mean: "뜻", exp: "설명", ex: "예문" };
const DEFAULT_SHOW = { word: true, mean: false, exp: false, ex: false };
const DEFAULT_SOUND_ENABLED = true;
const DATA_FILES = [
  { file: "toeic_beginner_1500.json", label: "초급 1500" },
  { file: "toeic_intermediate_1000.json", label: "중급 1000" },
  { file: "toeic_advanced_1000.json", label: "고급 1000" }
];
const DEFAULT_PREVIEW_POSITION = "top";
const DEFAULT_PROGRESS_POSITION = "top";
const BASE36 = "0123456789abcdefghijklmnopqrstuvwxyz";
const MASTERED_PREFIX = "vocab-mastered-";
const BOOKMARK_PREFIX = "vocab-bookmarks-";

let cards = [];
let i = 0;
let peek = {};
let show = loadShow();
let drag = null;
let swipeAt = 0;
let previewPosition = loadPreviewPosition();
let progressPosition = loadProgressPosition();
let soundEnabled = loadSoundEnabled();
let learnedState = [];
let bookmarkState = [];
let lastSpokenSignature = "";

const cardEl = document.getElementById("card");
const stage = document.getElementById("stage");
const header = document.querySelector("header");
const navPreview = document.getElementById("navPreview");
const prog = document.getElementById("prog");
const status = document.getElementById("status");
const prevSilhouette = document.getElementById("prevSilhouette");
const nextSilhouette = document.getElementById("nextSilhouette");

function getCurrentDatasetName() {
  const name = document.getElementById("dataset")?.value || "";
  return name.replace(/\.json$/i, "");
}

function currentWordText() {
  if (!cards.length || !cards[i]) return "";
  const card = cards[i];
  const phrases = phrasesOf(card);
  const key = String(card.key || (phrases[0] && phrases[0].phrase) || "").trim();
  return key;
}

function speakCurrentWord() {
  if (!("speechSynthesis" in window)) return;
  if (!soundEnabled) return;
  if (!cards.length) return;
  const visible = show.word || peek.word;
  if (!visible) return;

  const word = currentWordText();
  if (!word) return;

  const signature = `${getCurrentDatasetName()}:${i}:${word}`;
  if (signature === lastSpokenSignature) return;

  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  utterance.rate = 0.9;
  utterance.pitch = 1;
  utterance.volume = 1;

  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find((v) => /en(-|_)?(us|gb|au)/i.test(v.lang))
    || voices.find((v) => /^en/i.test(v.lang))
    || voices[0];
  if (preferred) utterance.voice = preferred;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
  lastSpokenSignature = signature;
}

function loadShow() {
  try {
    const saved = JSON.parse(localStorage.getItem("vocab-show") || "null");
    const next = { ...DEFAULT_SHOW };
    for (const key of FIELDS) {
      if (saved && typeof saved[key] === "boolean") next[key] = saved[key];
    }
    return next;
  } catch {
    return { ...DEFAULT_SHOW };
  }
}

function loadSoundEnabled() {
  try {
    const saved = localStorage.getItem("vocab-sound-enabled");
    if (saved === null) return DEFAULT_SOUND_ENABLED;
    return saved === "true";
  } catch {
    return DEFAULT_SOUND_ENABLED;
  }
}

function loadPreviewPosition() {
  try {
    const saved = localStorage.getItem("vocab-preview-position");
    return saved === "bottom" || saved === "hidden" ? saved : DEFAULT_PREVIEW_POSITION;
  } catch {
    return DEFAULT_PREVIEW_POSITION;
  }
}

function loadProgressPosition() {
  try {
    const saved = localStorage.getItem("vocab-progress-position");
    return saved === "bottom" || saved === "hidden" ? saved : DEFAULT_PROGRESS_POSITION;
  } catch {
    return DEFAULT_PROGRESS_POSITION;
  }
}

function encodeBitsToBase36(bits) {
  if (!bits || !bits.length) return "";
  const padded = [...bits];
  while (padded.length % 5 !== 0) padded.push(false);
  let out = "";
  for (let i = 0; i < padded.length; i += 5) {
    let value = 0;
    for (let j = 0; j < 5; j++) {
      if (padded[i + j]) value |= 1 << j;
    }
    out += BASE36[value] || "0";
  }
  return out;
}

function decodeBase36ToBits(str, expectedLength) {
  const bits = [];
  if (!str) return new Array(expectedLength || 0).fill(false);
  for (const ch of str) {
    const idx = BASE36.indexOf(ch);
    if (idx === -1) continue;
    for (let bit = 0; bit < 5; bit++) {
      bits.push(Boolean((idx >> bit) & 1));
      if (expectedLength && bits.length >= expectedLength) break;
    }
    if (expectedLength && bits.length >= expectedLength) break;
  }
  const final = new Array(expectedLength || bits.length).fill(false);
  for (let i = 0; i < final.length; i++) final[i] = Boolean(bits[i]);
  return final;
}

function loadStateForDataset(prefix, datasetName, expectedLength) {
  const key = `${prefix}${datasetName || "default"}`;
  try {
    const raw = localStorage.getItem(key) || "";
    return decodeBase36ToBits(raw, expectedLength);
  } catch {
    return new Array(expectedLength || 0).fill(false);
  }
}

function saveStateForDataset(prefix, datasetName, bits) {
  const key = `${prefix}${datasetName || "default"}`;
  try {
    localStorage.setItem(key, encodeBitsToBase36(bits));
  } catch {
    // private mode
  }
}

function save() {
  try {
    localStorage.setItem("vocab-i", String(i));
    localStorage.setItem("vocab-show", JSON.stringify(show));
    localStorage.setItem("vocab-sound-enabled", String(soundEnabled));
    localStorage.setItem("vocab-dataset", document.getElementById("dataset")?.value || "");
    localStorage.setItem("vocab-preview-position", previewPosition);
    localStorage.setItem("vocab-progress-position", progressPosition);
    localStorage.setItem("vocab-start-index", String(document.getElementById("startIndex")?.value || 0));
  } catch { /* private mode */ }
}

function populateDatasetOptions() {
  const select = document.getElementById("dataset");
  const saved = localStorage.getItem("vocab-dataset");
  select.innerHTML = DATA_FILES.map((entry) =>
    `<option value="${entry.file}">${entry.label}</option>`
  ).join("");
  const chosen = DATA_FILES.some((entry) => entry.file === saved) ? saved : DATA_FILES[0].file;
  select.value = chosen;
}

function populatePreviewPosition() {
  const select = document.getElementById("previewPosition");
  select.value = previewPosition;
}

function populateProgressPosition() {
  const select = document.getElementById("progressPosition");
  select.value = progressPosition;
}

function applyPreviewPosition() {
  const pos = previewPosition === "bottom" ? "bottom" : previewPosition === "hidden" ? "hidden" : "top";
  navPreview.classList.toggle("hidden", pos === "hidden");
  navPreview.style.order = pos === "bottom" ? "2" : "0";
}

function applyProgressPosition() {
  const pos = progressPosition === "bottom" ? "bottom" : progressPosition === "hidden" ? "hidden" : "top";
  prog.classList.toggle("hidden", pos === "hidden");

  if (pos === "top") {
    header.insertBefore(prog, document.getElementById("toggles"));
  } else if (pos === "bottom") {
    header.insertBefore(prog, status);
  }
}

function dedupeStrings(values) {
  const seen = new Set();
  const out = [];
  for (const value of values) {
    const clean = String(value).trim();
    if (!clean || seen.has(clean)) continue;
    seen.add(clean);
    out.push(clean);
  }
  return out;
}

function normalizeTextList(value) {
  if (value == null) return [];
  if (Array.isArray(value)) {
    return dedupeStrings(
      value.map((entry) =>
        typeof entry === "string" ? entry :
        typeof entry === "number" || typeof entry === "boolean" ? String(entry) : ""
      )
    );
  }
  const text = String(value).trim();
  return text ? [text] : [];
}

function normalizeExampleEntry(entry) {
  if (!entry || typeof entry !== "object") {
    if (typeof entry === "string") return entry.trim();
    return "";
  }

  const sentence = String(entry.s || entry.sentence || entry.en || entry.text || "").trim();
  const meaning = String(entry.m || entry.mean || entry.meaning || entry.kr || "").trim();
  if (sentence && meaning) return `${sentence} — ${meaning}`;
  return sentence || meaning;
}

function normalizeExampleList(value) {
  if (!Array.isArray(value)) return [];
  return dedupeStrings(value.map((entry) => normalizeExampleEntry(entry)));
}

function normalizePhraseList(list) {
  if (!Array.isArray(list)) return [];
  const out = [];
  for (const entry of list) {
    if (!entry || typeof entry !== "object") continue;
    const phrase = String(entry.ph || entry.phrase || "").trim();
    const rawMeans = Array.isArray(entry.ms) ? entry.ms : Array.isArray(entry.means) ? entry.means : [];
    const means = dedupeStrings(rawMeans.map((value) => String(value).trim()));
    if (phrase || means.length) {
      out.push({ phrase, means });
    }
  }
  return out;
}

function normalizeCard(item) {
  if (!item || typeof item !== "object") return null;

  const phrases = [...normalizePhraseList(item.phrases), ...normalizePhraseList(item.phs)];
  const key = String(item.key || item.phrase || (phrases[0] && phrases[0].phrase) || "").trim();

  const expParts = [];
  for (const entry of [...(Array.isArray(item.phs) ? item.phs : []), ...(Array.isArray(item.phrases) ? item.phrases : [])]) {
    if (!entry || typeof entry !== "object") continue;
    if (typeof entry.exp === "string") expParts.push(entry.exp);
    if (Array.isArray(entry.ex)) expParts.push(...normalizeExampleList(entry.ex));
  }

  const exp = dedupeStrings([
    ...normalizeTextList(item.exp),
    ...normalizeTextList(item.description),
    ...normalizeTextList(item.explanation),
    ...expParts
  ]);

  const ex = dedupeStrings([
    ...normalizeExampleList(item.ex),
    ...normalizeExampleList(item.examples),
    ...((Array.isArray(item.phs) ? item.phs : []).flatMap((entry) => normalizeExampleList(entry.ex || []))),
    ...((Array.isArray(item.phrases) ? item.phrases : []).flatMap((entry) => normalizeExampleList(entry.ex || [])))
  ]);

  if (!key && !phrases.length && !exp.length && !ex.length) return null;

  return {
    ...item,
    key,
    phrases,
    exp,
    ex
  };
}

function cardTitle(card) {
  if (!card) return "";
  const phrases = Array.isArray(card.phrases) ? card.phrases : [];
  const title = String(card.key || card.phrase || (phrases[0] && phrases[0].phrase) || "").trim();
  return title || "단어";
}

function esc(s) {
  return String(s).replace(/[&<>\"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function lines(v) {
  if (v == null) return [];
  const list = Array.isArray(v) ? v : [v];
  return list.map((x) => String(x).trim()).filter(Boolean);
}

function phrasesOf(card) {
  const list = Array.isArray(card.phrases) ? card.phrases : [];
  return list.map((p) => ({
    phrase: p && p.phrase ? String(p.phrase) : "",
    means: Array.isArray(p && p.means) ? p.means.map(String).filter(Boolean) : []
  })).filter((p) => p.phrase || p.means.length);
}

function hasField(card, key) {
  if (key === "word") return Boolean(card.key) || phrasesOf(card).some((p) => p.phrase);
  if (key === "mean") return phrasesOf(card).some((p) => p.means.length);
  if (key === "exp") return lines(card.exp).length > 0;
  return lines(card.ex).length > 0;
}

function wordHTML(card) {
  const ps = phrasesOf(card);
  const key = String(card.key || (ps[0] && ps[0].phrase) || "").trim();
  const forms = [];
  for (const p of ps) {
    if (p.phrase && p.phrase !== key && !forms.includes(p.phrase)) forms.push(p.phrase);
  }
  return `<p class="kicker">단어</p><h2 class="word">${esc(key)}</h2>` +
    (forms.length ? `<p class="forms">${forms.map(esc).join(" · ")}</p>` : "");
}

function meanHTML(card) {
  const ps = phrasesOf(card).filter((p) => p.means.length);
  const wordOpen = show.word || peek.word;
  if (!wordOpen || ps.length < 2) {
    const defs = [];
    for (const p of ps) for (const m of p.means) if (!defs.includes(m)) defs.push(m);
    return `<p class="kicker">뜻</p><p class="def big">${esc(defs.join(", "))}</p>`;
  }
  return `<p class="kicker">뜻</p><ul class="mean-list">` + ps.map((p) =>
    `<li><span class="form">${esc(p.phrase)}</span><span class="def">${esc(p.means.join(", "))}</span></li>`
  ).join("") + `</ul>`;
}

function textHTML(card, key, cls) {
  const bits = lines(card[key]).map((t) => `<p class="${cls}">${esc(t)}</p>`).join("");
  return `<p class="kicker">${LABELS[key]}</p>${bits}`;
}

function section(card, key) {
  if (!hasField(card, key)) return "";
  if (show[key] || peek[key]) {
    const html = key === "word" ? wordHTML(card) : key === "mean" ? meanHTML(card) : textHTML(card, key, key);
    return `<section class="block">${html}</section>`;
  }
  return `<button type="button" class="block cover" data-reveal="${key}"><span class="kicker">${LABELS[key]}</span><span class="hint">눌러서 보기</span></button>`;
}

function paintToggles() {
  for (const key of FIELDS) {
    const toggle = document.querySelector(`[data-toggle="${key}"]`);
    if (toggle) toggle.setAttribute("aria-pressed", show[key] ? "true" : "false");
  }

  const soundToggle = document.querySelector('[data-toggle="sound"]');
  if (soundToggle) soundToggle.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
}

function updateActionButtons() {
  const learnedBtn = document.getElementById("toggleLearned");
  const bookmarkBtn = document.getElementById("toggleBookmark");
  if (!learnedBtn || !bookmarkBtn) return;

  const currentLearned = cards.length ? Boolean(learnedState[i]) : false;
  const currentBookmarked = cards.length ? Boolean(bookmarkState[i]) : false;

  learnedBtn.textContent = currentLearned ? "외움 취소" : "외움 표시";
  learnedBtn.setAttribute("aria-pressed", currentLearned ? "true" : "false");
  bookmarkBtn.textContent = currentBookmarked ? "북마크 해제" : "북마크";
  bookmarkBtn.setAttribute("aria-pressed", currentBookmarked ? "true" : "false");
}

function updateSilhouettes() {
  const prev = cards[i - 1] ? cardTitle(cards[i - 1]) : "";
  const next = cards[i + 1] ? cardTitle(cards[i + 1]) : "";

  prevSilhouette.innerHTML = prev
    ? `<strong>이전</strong> · ${esc(prev)}`
    : `<strong>이전</strong> · 마지막입니다`;

  nextSilhouette.innerHTML = next
    ? `<strong>다음</strong> · ${esc(next)}`
    : `<strong>다음</strong> · 마지막입니다`;
}

function render(dir) {
  paintToggles();
  updateActionButtons();
  const total = cards.length;
  const done = total > 0 && i >= total;
  const shown = done ? total : Math.min(i + 1, total);
  document.getElementById("pos").textContent = total ? `${shown} / ${total}` : "0 / 0";
  document.getElementById("fill").style.width = total ? `${(shown / total) * 100}%` : "0%";
  const bar = document.getElementById("bar");
  bar.setAttribute("aria-valuenow", String(shown));
  bar.setAttribute("aria-valuemax", String(total));
  bar.setAttribute("aria-valuetext", total ? `${shown} / ${total}` : "0 / 0");
  document.getElementById("prev").disabled = i <= 0;
  document.getElementById("next").disabled = total === 0;
  document.getElementById("next").textContent = done ? "처음부터" : "다음";
  document.title = total ? `단어장 ${shown}/${total}` : "단어장";
  updateSilhouettes();

  if (!total) return;

  const meta = [];
  if (learnedState[i]) meta.push('<span class="meta-badge learned">외움</span>');
  if (bookmarkState[i]) meta.push('<span class="meta-badge bookmark">북마크</span>');
  const metaHtml = meta.length ? `<div class="meta-bar">${meta.join("")}</div>` : "";

  cardEl.innerHTML = done
    ? `<div class="done"><p class="kicker">끝</p><h2 class="word">다 봤어요</h2><p class="exp">${total}개를 넘겼습니다.</p></div>`
    : `${metaHtml}${FIELDS.map((key) => section(cards[i], key)).join("")}`;

  if (!done && soundEnabled && (show.word || peek.word)) {
    speakCurrentWord();
  } else if (!soundEnabled) {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    lastSpokenSignature = "";
  }

  if (!dir) return;
  cardEl.classList.remove("from-right", "from-left");
  void cardEl.offsetWidth;
  cardEl.classList.add(dir > 0 ? "from-right" : "from-left");
}

function setStartIndexFromInput() {
  const input = document.getElementById("startIndex");
  if (!input) return;
  const raw = Number(input.value);
  const max = Math.max(0, cards.length - 1);
  const next = Number.isFinite(raw) ? Math.max(0, Math.min(raw, max)) : 0;
  input.value = String(next);
  i = next;
  peek = {};
  save();
  render(0);
}

function go(delta) {
  if (!cards.length) return;
  const n = i + delta;
  if (n < 0 || n > cards.length) return;
  i = n;
  const startInput = document.getElementById("startIndex");
  if (startInput) startInput.value = String(i);
  peek = {};
  save();
  render(delta);
}

function restart() {
  i = 0;
  const startInput = document.getElementById("startIndex");
  if (startInput) startInput.value = "0";
  peek = {};
  save();
  render(-1);
}

function setCards(data, restore) {
  if (!Array.isArray(data)) throw new Error("not array");
  cards = data.map(normalizeCard).filter(Boolean);
  const datasetName = getCurrentDatasetName();
  learnedState = loadStateForDataset(MASTERED_PREFIX, datasetName, cards.length);
  bookmarkState = loadStateForDataset(BOOKMARK_PREFIX, datasetName, cards.length);
  peek = {};
  document.getElementById("status").textContent = cards.length ? "" : "단어가 없습니다.";
  let n = 0;
  if (restore) {
    const saved = Number(localStorage.getItem("vocab-i"));
    const startSaved = Number(localStorage.getItem("vocab-start-index"));
    n = Number.isInteger(saved) && saved >= 0 && saved <= cards.length ? saved : (Number.isInteger(startSaved) ? startSaved : 0);
    if (!Number.isInteger(n) || n < 0 || n > cards.length) n = 0;
  }
  i = cards.length ? n : 0;
  const startInput = document.getElementById("startIndex");
  if (startInput) startInput.value = String(i);
  lastSpokenSignature = "";
  render(0);
}

function fail(msg) {
  document.getElementById("status").textContent = msg;
  if (!cards.length) {
    cardEl.innerHTML = `<div class="error"><p class="exp">${esc(msg)}</p></div>`;
  }
}

function loadDataset(fileName, options = {}) {
  const { restore = true } = options;
  const name = fileName || document.getElementById("dataset").value;
  if (!name) return;

  localStorage.setItem("vocab-dataset", name);
  fetch(`./data/${name}`, { cache: "no-store" })
    .then((res) => {
      if (!res.ok) throw new Error(String(res.status));
      return res.json();
    })
    .then((data) => setCards(data, restore))
    .catch(() => fail(`${name}을 불러오지 못했습니다.`));
}

async function loadDefault() {
  populateDatasetOptions();
  populatePreviewPosition();
  populateProgressPosition();
  applyPreviewPosition();
  applyProgressPosition();
  const savedDataset = localStorage.getItem("vocab-dataset") || document.getElementById("dataset").value;
  const select = document.getElementById("dataset");
  if (savedDataset && DATA_FILES.some((entry) => entry.file === savedDataset)) {
    select.value = savedDataset;
  }
  const savedStart = Number(localStorage.getItem("vocab-start-index"));
  if (Number.isInteger(savedStart) && savedStart >= 0) {
    document.getElementById("startIndex").value = String(savedStart);
  }
  loadDataset(document.getElementById("dataset").value, { restore: true });
}

document.getElementById("toggles").addEventListener("click", (e) => {
  const b = e.target.closest("[data-toggle]");
  if (!b) return;
  const key = b.dataset.toggle;

  if (key === "sound") {
    soundEnabled = !soundEnabled;
    save();
    render(0);
    return;
  }

  show[key] = !show[key];
  if (!show[key]) delete peek[key];
  save();
  render(0);
});

document.getElementById("toggleLearned").addEventListener("click", () => {
  if (!cards.length) return;
  learnedState[i] = !learnedState[i];
  saveStateForDataset(MASTERED_PREFIX, getCurrentDatasetName(), learnedState);
  render(0);
});

document.getElementById("toggleBookmark").addEventListener("click", () => {
  if (!cards.length) return;
  bookmarkState[i] = !bookmarkState[i];
  saveStateForDataset(BOOKMARK_PREFIX, getCurrentDatasetName(), bookmarkState);
  render(0);
});

document.getElementById("prev").addEventListener("click", () => go(-1));
document.getElementById("next").addEventListener("click", () => {
  if (i >= cards.length) restart();
  else go(1);
});
document.getElementById("load").addEventListener("click", () => loadDataset(document.getElementById("dataset").value, { restore: false }));
document.getElementById("dataset").addEventListener("change", () => loadDataset(document.getElementById("dataset").value, { restore: false }));
document.getElementById("previewPosition").addEventListener("change", (e) => {
  previewPosition = e.target.value === "bottom" || e.target.value === "hidden" ? e.target.value : DEFAULT_PREVIEW_POSITION;
  applyPreviewPosition();
  save();
});
document.getElementById("progressPosition").addEventListener("change", (e) => {
  progressPosition = e.target.value === "bottom" || e.target.value === "hidden" ? e.target.value : DEFAULT_PROGRESS_POSITION;
  applyProgressPosition();
  save();
});
document.getElementById("startIndex").addEventListener("change", setStartIndexFromInput);
document.getElementById("startIndex").addEventListener("input", () => {
  const input = document.getElementById("startIndex");
  if (!input) return;
  if (input.value === "") return;
  const n = Number(input.value);
  if (!Number.isFinite(n) || n < 0) {
    input.value = "0";
  }
});

cardEl.addEventListener("click", (e) => {
  if (Date.now() - swipeAt < 450) return;
  const b = e.target.closest("[data-reveal]");
  if (!b) return;
  peek[b.dataset.reveal] = true;
  render(0);
});

document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); if (i >= cards.length) restart(); else go(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
});

stage.addEventListener("pointerdown", (e) => {
  if (!e.isPrimary || e.button !== 0 || !cards.length) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, locked: "" };
  stage.setPointerCapture?.(e.pointerId);
});

window.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (!drag.locked) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    drag.locked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (drag.locked === "y") { drag = null; cardEl.style.transform = ""; stage.classList.remove("dragging"); return; }
  }
  stage.classList.add("dragging");
  cardEl.style.transform = `translateX(${Math.max(-96, Math.min(96, dx * 0.4))}px)`;
});

function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  const swipe = !cancel && drag.locked === "x" && Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy);
  drag = null;
  cardEl.style.transform = "";
  stage.classList.remove("dragging");
  if (!swipe) return;
  swipeAt = Date.now();
  if (dx < 0) { if (i >= cards.length) return; go(1); }
  else go(-1);
}

window.addEventListener("pointerup", (e) => endDrag(e, false));
window.addEventListener("pointercancel", (e) => endDrag(e, true));
window.speechSynthesis?.addEventListener?.("voiceschanged", () => {});

loadDefault();
</script>
</body>
</html>
