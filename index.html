<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe8">
<title>단어장</title>
<style>
  :root {
    --bg: #f3efe8;
    --ink: #17140f;
    --muted: #776e62;
    --faint: rgba(23, 20, 15, .08);
    --glass: rgba(255, 255, 255, .58);
    --glass-line: rgba(23, 20, 15, .08);
    --accent: #1d7a52;
    --mark: #d99400;
    --sheet: #fffdf9;
    --slide-s: 46%;
    --slide-l: 92%;
    --slide-l2: 84%;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c0b0a;
    --ink: #f4f0e8;
    --muted: #a59c90;
    --faint: rgba(255, 255, 255, .1);
    --glass: rgba(255, 255, 255, .08);
    --glass-line: rgba(255, 255, 255, .12);
    --accent: #3fbf86;
    --mark: #f2b630;
    --sheet: #1b1917;
    --slide-s: 30%;
    --slide-l: 8%;
    --slide-l2: 17%;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0b0a;
      --ink: #f4f0e8;
      --muted: #a59c90;
      --faint: rgba(255, 255, 255, .1);
      --glass: rgba(255, 255, 255, .08);
      --glass-line: rgba(255, 255, 255, .12);
      --accent: #3fbf86;
      --mark: #f2b630;
      --sheet: #1b1917;
      --slide-s: 30%;
      --slide-l: 8%;
      --slide-l2: 17%;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: .35; }
  svg { display: block; }

  .app {
    position: relative;
    width: min(480px, 100%);
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    container-type: inline-size;
  }
  @media (min-width: 520px) {
    .app { box-shadow: 0 0 0 1px var(--glass-line), 0 24px 64px rgba(0, 0, 0, .14); }
  }

  /* feed */
  .feed {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior: contain;
    scrollbar-width: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .slide {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background:
      radial-gradient(120% 70% at 15% 0%, hsl(var(--h, 40) var(--slide-s) var(--slide-l2)), transparent 62%),
      radial-gradient(90% 60% at 100% 100%, hsl(calc(var(--h, 40) + 40) var(--slide-s) var(--slide-l2)), transparent 60%),
      hsl(var(--h, 40) calc(var(--slide-s) * .5) var(--slide-l));
  }
  .body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    scrollbar-width: none;
    padding: calc(40px + env(safe-area-inset-top)) 80px 12px 22px;
  }
  .body::-webkit-scrollbar { display: none; }
  .inner { margin-block: auto; width: 100%; }

  .word {
    display: block;
    width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    font-size: clamp(30px, calc((100cqw - 110px) / (var(--len, 6) * .6)), 60px);
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1.08;
    overflow-wrap: anywhere;
  }
  .word:active { opacity: .7; }
  .forms { margin: 10px 0 0; font-size: 16px; color: var(--muted); line-height: 1.45; }
  .phs { margin-top: 18px; }
  .ph + .ph { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--faint); }
  .ph-word { margin: 0 0 4px; font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: .01em; }
  .mean { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.38; letter-spacing: -.02em; }
  .exp { margin: 8px 0 0; font-size: 15.5px; line-height: 1.6; color: var(--muted); }
  .ex {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 16px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
  .ex .s {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.45;
  }
  .ex .s:active { opacity: .7; }
  .ex .s .say {
    display: inline-block;
    width: 15px;
    height: 15px;
    margin-left: 6px;
    vertical-align: -2px;
    color: var(--muted);
  }
  .ex mark { background: none; color: inherit; box-shadow: inset 0 -.42em 0 color-mix(in srgb, var(--accent) 28%, transparent); }
  .ex .m { margin: 5px 0 0; font-size: 14px; line-height: 1.5; color: var(--muted); }

  .covers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .cover {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px dashed color-mix(in srgb, var(--ink) 26%, transparent);
    background: var(--glass);
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .cover svg { width: 16px; height: 16px; }
  .cover:active { transform: scale(.97); }
  .cover-word {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    width: 100%;
    padding: 18px 20px;
    border-radius: 20px;
  }
  .cover-word .dots { font-size: 30px; letter-spacing: .12em; color: color-mix(in srgb, var(--ink) 22%, transparent); }

  .caption {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    padding: 10px 80px calc(18px + env(safe-area-inset-bottom)) 22px;
    font-size: 14px;
  }
  .handle { padding: 0; border: 0; background: none; font-weight: 700; }
  .handle:active { opacity: .6; }
  .pos { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pos .of, .no { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ftag { font-weight: 700; color: var(--mark); }
  .ftag[data-f="todo"] { color: var(--accent); }
  .tags { display: contents; }
  .tag { font-weight: 700; }
  .tag.learned { color: var(--accent); }
  .tag.marked { color: var(--mark); }

  .end { text-align: center; }
  .end .kicker { margin: 0 0 6px; font-size: 13px; color: var(--muted); letter-spacing: .08em; }
  .end h2 { margin: 0; font-size: 32px; letter-spacing: -.03em; }
  .end p { margin: 10px 0 0; font-size: 15px; line-height: 1.55; color: var(--muted); }
  .btn {
    margin-top: 20px;
    padding: 12px 22px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    font-size: 15px;
    font-weight: 700;
  }
  .slide.flat .body { padding-right: 22px; }

  /* overlays */
  .hud {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    z-index: 4;
    padding: calc(8px + env(safe-area-inset-top)) 14px 0;
    pointer-events: none;
  }
  .scrub {
    position: relative;
    margin: -8px 0;
    padding: 8px 0;
    pointer-events: auto;
    touch-action: none;
    cursor: pointer;
    --pos: 0%;
  }
  .scrub:focus-visible { outline: none; }
  .bar { height: 3px; border-radius: 99px; background: var(--faint); overflow: hidden; transition: height .15s ease; }
  .fill { height: 100%; width: var(--pos); background: var(--ink); border-radius: inherit; transition: width .2s ease; }
  .thumb {
    position: absolute;
    top: 50%;
    left: var(--pos);
    width: 16px;
    height: 16px;
    margin: -8px 0 0 -8px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 1px 6px rgba(0, 0, 0, .25);
    transform: scale(0);
    transition: transform .15s ease;
  }
  .scrub:hover .bar, .scrub:focus-visible .bar, .scrub.dragging .bar { height: 6px; }
  .scrub:hover .thumb, .scrub:focus-visible .thumb, .scrub.dragging .thumb { transform: scale(1); }
  .scrub.dragging .fill { transition: none; }
  .bubble {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    padding: 6px 11px;
    border-radius: 10px;
    background: var(--ink);
    color: var(--bg);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .bubble .w { font-weight: 500; opacity: .75; }

  .rail {
    position: absolute;
    right: 10px;
    bottom: calc(60px + env(safe-area-inset-bottom));
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .act {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    width: 58px;
    padding: 0;
    border: 0;
    background: none;
  }
  .act .ico {
    display: grid;
    place-items: center;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1px solid var(--glass-line);
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    transition: transform .15s ease;
  }
  .act .ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .act:active .ico { transform: scale(.9); }
  .act .lbl { font-size: 11.5px; font-weight: 700; }
  .act.learn[aria-pressed="true"] { color: var(--accent); }
  .act.learn[aria-pressed="true"] circle { fill: var(--accent); }
  .act.learn[aria-pressed="true"] path { stroke: #fff; }
  .act.mark[aria-pressed="true"] { color: var(--mark); }
  .act.mark[aria-pressed="true"] path { fill: var(--mark); }
  .act.play[aria-pressed="true"] { color: var(--accent); }
  .act.play .pause { display: none; }
  .act.play[aria-pressed="true"] .play { display: none; }
  .act.play[aria-pressed="true"] .pause { display: block; }
  .act.bump .ico { animation: bump .32s ease; }
  @keyframes bump { 40% { transform: scale(1.18); } }

  .pop {
    position: absolute;
    z-index: 6;
    width: 96px;
    height: 96px;
    margin: -48px 0 0 -48px;
    color: var(--mark);
    pointer-events: none;
    opacity: 0;
  }
  .pop svg { width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .25)); }
  .pop.go { animation: pop .7s ease forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.4); }
    25% { opacity: 1; transform: scale(1.12); }
    45% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-30px) scale(.9); }
  }

  .toast {
    position: absolute;
    left: 50%;
    bottom: calc(76px + env(safe-area-inset-bottom));
    z-index: 6;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transform: translate(-50%, 10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* settings sheet */
  .scrim {
    position: absolute;
    inset: 0;
    z-index: 7;
    background: rgba(0, 0, 0, .38);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 8;
    max-height: 88%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 8px 18px calc(20px + env(safe-area-inset-bottom));
    border-radius: 24px 24px 0 0;
    background: var(--sheet);
    box-shadow: 0 -10px 40px rgba(0, 0, 0, .18);
    transform: translateY(105%);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  }
  .app.sheet-open .scrim { opacity: 1; pointer-events: auto; }
  .app.sheet-open .sheet { transform: none; }
  .grab { width: 40px; height: 5px; margin: 0 auto 10px; border-radius: 99px; background: var(--faint); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
  .x { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--faint); }
  .x svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .stats { margin: 6px 0 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); }
  .group { margin-top: 20px; }
  .group h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .note { margin: -4px 0 8px; font-size: 12.5px; color: var(--muted); }
  .note.sub { margin-top: 14px; }
  .seg {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 2px;
    padding: 3px;
    border-radius: 13px;
    background: var(--faint);
  }
  .seg button {
    padding: 10px 6px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--faint);
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
  .jump { display: flex; gap: 8px; }
  .jump input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border: 1px solid var(--faint);
    border-radius: 12px;
    background: transparent;
    font-size: 16px;
  }
  .jump button { padding: 0 20px; border: 0; border-radius: 12px; background: var(--ink); color: var(--sheet); font-weight: 700; }
  .voice { display: flex; gap: 8px; margin-top: 8px; }
  .voice select {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--faint);
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
  }
  .voice button { padding: 0 16px; border: 1px solid var(--faint); border-radius: 12px; background: transparent; font-size: 14px; font-weight: 600; }
  .keys { margin: 22px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .keys kbd { padding: 1px 6px; border-radius: 5px; border: 1px solid var(--faint); font: inherit; font-size: 12px; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .scrim, .toast, .fill { transition: none; }
    .pop.go, .act.bump .ico { animation: none; }
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <main class="feed" id="feed"></main>

    <header class="hud">
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="위치" aria-valuemin="1" aria-valuenow="0" aria-valuemax="0">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="thumb" id="thumb"></div>
        <div class="bubble" id="bubble" hidden></div>
      </div>
    </header>

    <nav class="rail" id="rail" aria-label="단어 동작">
      <button type="button" class="act learn" id="learnBtn" aria-pressed="false" aria-label="외움 표시">
        <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.8 2.8 5.4-5.6"/></svg></span>
        <span class="lbl">외움</span>
      </button>
      <button type="button" class="act mark" id="markBtn" aria-pressed="false" aria-label="북마크">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.3-6.5 4.3v-16a1 1 0 0 1 1-1z"/></svg></span>
        <span class="lbl">북마크</span>
      </button>
      <button type="button" class="act" id="speakBtn" aria-label="발음 듣기">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.2 6.4a7.6 7.6 0 0 1 0 11.2"/></svg></span>
        <span class="lbl">발음</span>
      </button>
      <button type="button" class="act play" id="playBtn" aria-pressed="false" aria-label="자동 재생">
        <span class="ico"><svg viewBox="0 0 24 24"><path class="play" d="M8 5.5v13l11-6.5z"/><path class="pause" d="M8 5.5v13M16 5.5v13"/></svg></span>
        <span class="lbl">재생</span>
      </button>
      <button type="button" class="act" id="setBtn" aria-label="설정 열기" aria-haspopup="dialog">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span>
        <span class="lbl">설정</span>
      </button>
    </nav>

    <div class="pop" id="pop" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.3-6.5 4.3v-16a1 1 0 0 1 1-1z"/></svg></div>
    <div class="toast" id="toast" role="status"></div>

    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert>
      <div class="grab"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle">설정</h2>
        <button type="button" class="x" id="closeSheet" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <p class="stats" id="stats"></p>
      <div class="group">
        <h3>단어장</h3>
        <div class="seg" id="segData"></div>
      </div>
      <div class="group">
        <h3>목록</h3>
        <div class="seg" id="segFilter"></div>
      </div>
      <div class="group">
        <h3>항상 보이기</h3>
        <p class="note">끈 항목은 가려두고, 탭해서 확인해요.</p>
        <div class="chips" id="chipsShow"></div>
      </div>
      <div class="group">
        <h3>번호로 이동</h3>
        <form class="jump" id="jumpForm">
          <input id="jumpInput" type="number" inputmode="numeric" min="1" placeholder="No." aria-label="이동할 단어 번호">
          <button type="submit">이동</button>
        </form>
      </div>
      <div class="group">
        <h3>자동 발음</h3>
        <div class="seg" id="segSound"></div>
        <div class="voice">
          <select id="voiceSelect" aria-label="목소리"></select>
          <button type="button" id="voiceTest">들어보기</button>
        </div>
      </div>
      <div class="group">
        <h3>자동 재생</h3>
        <p class="note">단어 뜻</p>
        <div class="seg" id="segWordMean"></div>
        <p class="note sub">예문 뜻</p>
        <div class="seg" id="segExMean"></div>
        <p class="note sub">단어 반복</p>
        <div class="seg" id="segWordN"></div>
        <p class="note sub">예문 반복</p>
        <div class="seg" id="segExN"></div>
      </div>
      <div class="group">
        <h3>화면</h3>
        <div class="seg" id="segTheme"></div>
      </div>
      <p class="keys">위아래로 넘기기 · 두 번 탭해서 북마크<br><kbd>↑</kbd> <kbd>↓</kbd> 이동 · <kbd>M</kbd> 외움 · <kbd>B</kbd> 북마크 · <kbd>S</kbd> 발음 · <kbd>P</kbd> 재생 · <kbd>,</kbd> 설정</p>
    </section>
  </div>
<script>
const FIELDS = ["word", "mean", "exp", "ex"];
const LABELS = { word: "단어", mean: "뜻", exp: "설명", ex: "예문" };
const DEFAULT_SHOW = { word: true, mean: false, exp: false, ex: false };
const DEFAULT_SOUND_ENABLED = true;
const DATA_FILES = [
  { file: "toeic_beginner_1500.json", label: "초급 1500" },
  { file: "toeic_intermediate_1000.json", label: "중급 1000" },
  { file: "toeic_advanced_1000.json", label: "상급 1000" },
  { file: "toeic_high_1000.json", label: "고급 1000" }
];
const FILTERS = [
  { value: "all", label: "전체" },
  { value: "todo", label: "안 외운 것" },
  { value: "marked", label: "북마크" }
];
const THEMES = [
  { value: "auto", label: "자동" },
  { value: "light", label: "라이트" },
  { value: "dark", label: "다크" }
];
const BASE36 = "0123456789abcdefghijklmnopqrstuvwxyz";
const MASTERED_PREFIX = "vocab-mastered-";
const BOOKMARK_PREFIX = "vocab-bookmarks-";
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>';
const SAY = '<svg class="say" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg>';

const $ = (id) => document.getElementById(id);
const app = $("app");
const feed = $("feed");
const learnBtn = $("learnBtn");
const markBtn = $("markBtn");
const speakBtn = $("speakBtn");
const playBtn = $("playBtn");
const legacy = { file: store("vocab-dataset"), i: store("vocab-i") };

let datasetFile = "";
let cards = [];     // normalized cards; card.n is the index used by the mastered/bookmark bitsets
let list = [];      // card.n values visible under the current filter
let learned = [];
let marked = [];
let cur = 0;        // slide position in list (list.length = end slide)
let pending = null; // slide position a smooth scroll is heading to
let peekAt = -1;    // slide whose hidden fields were tapped open
let peek = new Set();
let show = loadShow();
let soundEnabled = loadSoundEnabled();
let filter = pick(store("vocab-filter"), FILTERS, "all");
let theme = pick(store("vocab-theme"), THEMES, "auto");
let lastSpoken = "";
let ticking = false;
let settleTimer = 0;
let toastTimer = 0;
let lastTap = { t: 0, x: 0, y: 0 };
let sheetReturn = null;
let scrubbing = null; // slide position under the finger while dragging the progress bar
let lastN = 0;        // card.n of the last word shown, kept across filters
let autoplay = false;
let playToken = 0;
let playDriven = false; // the in-flight scroll was started by autoplay, not the user
let playWordMean = store("vocab-play-word-mean") !== "false";
let playExMean = store("vocab-play-ex-mean") !== "false";
let wordRepeat = loadRepeat("vocab-play-word-n");
let exRepeat = loadRepeat("vocab-play-ex-n");
const rendered = new Set();

function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch { /* private mode */ }
  return null;
}

function pick(value, options, fallback) {
  return options.some((o) => o.value === value) ? value : fallback;
}

function loadShow() {
  try {
    const saved = JSON.parse(store("vocab-show") || "null");
    const next = { ...DEFAULT_SHOW };
    for (const key of FIELDS) {
      if (saved && typeof saved[key] === "boolean") next[key] = saved[key];
    }
    return next;
  } catch {
    return { ...DEFAULT_SHOW };
  }
}

function loadSoundEnabled() {
  const saved = store("vocab-sound-enabled");
  return saved === null ? DEFAULT_SOUND_ENABLED : saved === "true";
}

function loadRepeat(key) {
  const n = Number(store(key));
  return Number.isInteger(n) && n >= 1 && n <= 5 ? n : 1;
}

function encodeBitsToBase36(bits) {
  if (!bits || !bits.length) return "";
  const padded = [...bits];
  while (padded.length % 5 !== 0) padded.push(false);
  let out = "";
  for (let i = 0; i < padded.length; i += 5) {
    let value = 0;
    for (let j = 0; j < 5; j++) {
      if (padded[i + j]) value |= 1 << j;
    }
    out += BASE36[value] || "0";
  }
  return out;
}

function decodeBase36ToBits(str, expectedLength) {
  const bits = [];
  for (const ch of str || "") {
    const idx = BASE36.indexOf(ch);
    if (idx === -1) continue;
    for (let bit = 0; bit < 5; bit++) bits.push(Boolean((idx >> bit) & 1));
  }
  return Array.from({ length: expectedLength }, (_, i) => Boolean(bits[i]));
}

function datasetName() {
  return datasetFile.replace(/\.json$/i, "") || "default";
}

function datasetLabel() {
  const entry = DATA_FILES.find((d) => d.file === datasetFile);
  return entry ? entry.label : "단어장";
}

function loadBits(prefix) {
  return decodeBase36ToBits(store(prefix + datasetName()) || "", cards.length);
}

function saveBits(prefix, bits) {
  store(prefix + datasetName(), encodeBitsToBase36(bits));
}

/* ---------- data ---------- */

function dedupe(values) {
  const out = [];
  for (const value of values) {
    const clean = String(value ?? "").trim();
    if (clean && !out.includes(clean)) out.push(clean);
  }
  return out;
}

function textList(value) {
  if (value == null) return [];
  const raw = Array.isArray(value) ? value : [value];
  return dedupe(raw.filter((v) => ["string", "number"].includes(typeof v)));
}

function normalizeExample(entry) {
  if (typeof entry === "string") return entry.trim() ? { s: entry.trim(), m: "" } : null;
  if (!entry || typeof entry !== "object") return null;
  const s = String(entry.s || entry.sentence || entry.en || entry.text || "").trim();
  const m = String(entry.m || entry.mean || entry.meaning || entry.kr || "").trim();
  return s || m ? { s, m } : null;
}

function exampleList(value) {
  if (value == null) return [];
  return (Array.isArray(value) ? value : [value]).map(normalizeExample).filter(Boolean);
}

function normalizePhrase(entry) {
  if (!entry || typeof entry !== "object") return null;
  const phrase = String(entry.ph || entry.phrase || "").trim();
  const means = dedupe(Array.isArray(entry.ms) ? entry.ms : Array.isArray(entry.means) ? entry.means : []);
  const exp = textList(entry.exp);
  const ex = exampleList(entry.ex);
  return phrase || means.length || exp.length || ex.length ? { phrase, means, exp, ex } : null;
}

function normalizeCard(item) {
  if (!item || typeof item !== "object") return null;
  const raw = [...(Array.isArray(item.phs) ? item.phs : []), ...(Array.isArray(item.phrases) ? item.phrases : [])];
  const phrases = raw.map(normalizePhrase).filter(Boolean);

  // legacy: explanation / examples on the card itself
  const exp = dedupe([...textList(item.exp), ...textList(item.description), ...textList(item.explanation)]);
  const ex = [...exampleList(item.ex), ...exampleList(item.examples)];
  if (exp.length || ex.length) phrases.push({ phrase: "", means: [], exp, ex });

  const key = String(item.key || item.phrase || (phrases[0] && phrases[0].phrase) || "").trim();
  if (!key && !phrases.length) return null;
  const forms = dedupe(phrases.map((p) => p.phrase)).filter((p) => p !== key);
  const len = Math.max(5, ...key.split(/\s+/).map((w) => w.length));
  return { key, forms, phrases, len };
}

function has(card, field) {
  if (field === "word") return Boolean(card.key);
  if (field === "mean") return card.phrases.some((p) => p.means.length);
  if (field === "exp") return card.phrases.some((p) => p.exp.length);
  return card.phrases.some((p) => p.ex.length);
}

/* ---------- rendering ---------- */

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function pad(n) {
  return String(n).padStart(4, "0");
}

function visible(p, field) {
  return show[field] || (peekAt === p && peek.has(field));
}

function highlight(html, phrase) {
  const stem = esc(phrase).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if (!stem) return html;
  return html.replace(new RegExp(`\\b${stem}(?:s|es|d|ed|ing)?\\b`, "gi"), "<mark>$&</mark>");
}

function exampleHTML(x, phrase, wordOn) {
  const s = x.s
    ? `<button type="button" class="s" data-say="${esc(x.s)}">${wordOn ? highlight(esc(x.s), phrase) : esc(x.s)}${SAY}</button>`
    : "";
  return `<div class="ex">${s}${x.m ? `<p class="m">${esc(x.m)}</p>` : ""}</div>`;
}

function phraseHTML(ph, p, withHead, wordOn) {
  let out = "";
  if (ph.means.length && visible(p, "mean")) out += `<p class="mean">${ph.means.map(esc).join(", ")}</p>`;
  if (ph.exp.length && visible(p, "exp")) out += ph.exp.map((t) => `<p class="exp">${esc(t)}</p>`).join("");
  if (ph.ex.length && visible(p, "ex")) out += ph.ex.map((x) => exampleHTML(x, ph.phrase, wordOn)).join("");
  if (!out) return "";
  const head = withHead && ph.phrase ? `<p class="ph-word">${esc(ph.phrase)}</p>` : "";
  return `<div class="ph">${head}${out}</div>`;
}

function slideHTML(card, p) {
  const wordOn = visible(p, "word");
  const head = wordOn
    ? `<button type="button" class="word" style="--len:${card.len}" data-say="${esc(card.key)}" aria-label="${esc(card.key)}, 발음 듣기">${esc(card.key)}</button>` +
      (card.forms.length ? `<p class="forms">${card.forms.map(esc).join(" · ")}</p>` : "")
    : `<button type="button" class="cover cover-word" data-reveal="word"><span class="dots">●●●●●</span><span>단어 보기</span></button>`;
  const multi = card.phrases.filter((ph) => ph.phrase).length > 1;
  const phs = card.phrases.map((ph) => phraseHTML(ph, p, multi && wordOn, wordOn)).join("");
  const covers = ["mean", "exp", "ex"]
    .filter((f) => has(card, f) && !visible(p, f))
    .map((f) => `<button type="button" class="cover" data-reveal="${f}">${EYE}${LABELS[f]}</button>`)
    .join("");
  return `<div class="body"><div class="inner">${head}` +
    (phs ? `<div class="phs">${phs}</div>` : "") +
    (covers ? `<div class="covers">${covers}</div>` : "") +
    `</div></div>` + captionHTML(card, p);
}

function tagsHTML(n) {
  return (learned[n] ? '<span class="tag learned">#외움</span>' : "") +
    (marked[n] ? '<span class="tag marked">#북마크</span>' : "");
}

// the post's caption doubles as the header: list name opens settings, then position
function captionHTML(card, p) {
  const filtered = filter !== "all";
  const label = filtered ? FILTERS.find((f) => f.value === filter).label : "";
  return `<footer class="caption">` +
    `<button type="button" class="handle" data-act="sheet" aria-label="${esc(datasetLabel())}, 설정 열기">@${esc(datasetLabel())}</button>` +
    (filtered ? `<span class="ftag" data-f="${filter}">${label}</span>` : "") +
    `<span class="pos">${p + 1}<span class="of"> / ${list.length}</span></span>` +
    // a filter skips words, so the position no longer matches the word number
    (filtered ? `<span class="no">No.${pad(card.n + 1)}</span>` : "") +
    `<span class="tags">${tagsHTML(card.n)}</span></footer>`;
}

function endHTML() {
  let title = "다 봤어요";
  let text = `${list.length}개를 넘겼습니다.`;
  let action = '<button type="button" class="btn" data-act="top">처음으로</button>';
  if (!list.length) {
    action = '<button type="button" class="btn" data-act="all">전체 보기</button>';
    if (filter === "marked") {
      title = "북마크가 비어 있어요";
      text = "단어를 두 번 탭하거나 북마크 버튼을 누르면 여기에 모여요.";
    } else if (filter === "todo") {
      title = "모두 외웠어요";
      text = "이 단어장에 남은 단어가 없습니다.";
    } else {
      title = "단어가 없어요";
      text = "";
      action = "";
    }
  }
  return `<div class="body"><div class="inner end"><p class="kicker">끝</p><h2>${title}</h2>${text ? `<p>${text}</p>` : ""}${action}</div></div>`;
}

function renderSlide(p) {
  const el = feed.children[p];
  if (!el) return;
  const scroller = el.querySelector(".body");
  const top = scroller ? scroller.scrollTop : 0;
  el.innerHTML = p >= list.length ? endHTML() : slideHTML(cards[list[p]], p);
  if (top) el.querySelector(".body").scrollTop = top;
  rendered.add(p);
}

function fillAround() {
  for (const p of [...rendered]) {
    if (Math.abs(p - cur) > 4) {
      feed.children[p].innerHTML = "";
      rendered.delete(p);
    }
  }
  const last = feed.children.length - 1;
  for (let p = Math.max(0, cur - 2); p <= Math.min(last, cur + 2); p++) {
    if (!rendered.has(p)) renderSlide(p);
  }
}

function message(title, text) {
  list = [];
  cur = 0;
  rendered.clear();
  feed.innerHTML = `<section class="slide flat"><div class="body"><div class="inner end"><h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ""}</div></div></section>`;
  updateHud();
}

function build(targetN) {
  if (autoplay) setAutoplay(false);
  lastN = Math.min(targetN, Math.max(0, cards.length - 1));
  list =cards.filter((c) => filter === "all" || (filter === "todo" ? !learned[c.n] : marked[c.n])).map((c) => c.n);
  rendered.clear();
  peek = new Set();
  peekAt = -1;
  pending = null;
  lastSpoken = "";
  const slides = list.map((n, p) => `<section class="slide" data-p="${p}" style="--h:${(n * 47) % 360}"></section>`);
  slides.push(`<section class="slide flat" data-p="${list.length}"></section>`);
  feed.innerHTML = slides.join("");
  let p = list.findIndex((n) => n >= targetN);
  if (p < 0) p = targetN >= cards.length ? list.length : Math.max(0, list.length - 1);
  cur = p;
  feed.scrollTop = p * feed.clientHeight;
  fillAround();
  updateHud();
  settle();
}

function updateHud() {
  const total = list.length;
  const n = cur < total ? list[cur] : -1;
  if (n >= 0) lastN = n;
  const shown = total ? Math.min(cur + 1, total) : 0;
  const scrub = $("scrub");
  if (scrubbing === null) scrub.style.setProperty("--pos", total ? `${(shown / total) * 100}%` : "0%");
  scrub.setAttribute("aria-valuenow", String(shown));
  scrub.setAttribute("aria-valuemax", String(total));
  scrub.setAttribute("aria-valuetext", n >= 0 ? `${shown} / ${total}, No.${pad(n + 1)}` : `${shown} / ${total}`);
  learnBtn.disabled = markBtn.disabled = speakBtn.disabled = n < 0;
  playBtn.disabled = !total;
  learnBtn.setAttribute("aria-pressed", n >= 0 && learned[n] ? "true" : "false");
  markBtn.setAttribute("aria-pressed", n >= 0 && marked[n] ? "true" : "false");
  document.title = total && n >= 0 ? `${cards[n].key} · 단어장 ${shown}/${total}` : "단어장";
}

/* ---------- navigation ---------- */

function settle() {
  pending = null;
  if (peekAt >= 0 && peekAt !== cur) {
    const old = peekAt;
    peekAt = -1;
    peek = new Set();
    if (rendered.has(old)) renderSlide(old);
  }
  if (!cards.length) return;
  store(`vocab-i-${datasetName()}`, String(cur < list.length ? list[cur] : cards.length));
  if (!autoplay) autoSpeak();
}

function scrollToPos(p, smooth) {
  const last = feed.children.length - 1;
  const target = Math.max(0, Math.min(p, last));
  pending = target;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  feed.scrollTo({ top: target * feed.clientHeight, behavior: smooth && !reduce ? "smooth" : "auto" });
}

function step(delta) {
  scrollToPos((pending ?? cur) + delta, true);
}

feed.addEventListener("scroll", () => {
  if (!ticking) {
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const h = feed.clientHeight || 1;
      const p = Math.max(0, Math.min(Math.round(feed.scrollTop / h), feed.children.length - 1));
      if (p !== cur) {
        const mine = playDriven && p === pending;
        playDriven = false;
        if (autoplay && !mine) setAutoplay(false);
        cur = p;
        fillAround();
        updateHud();
      }
    });
  }
  clearTimeout(settleTimer);
  settleTimer = setTimeout(settle, 160);
}, { passive: true });

/* ---------- progress scrubber ---------- */

function scrubAt(clientX) {
  const r = $("scrub").getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  return Math.max(0, Math.min(list.length - 1, Math.ceil(ratio * list.length) - 1));
}

function paintScrub(p) {
  const scrub = $("scrub");
  const bubble = $("bubble");
  const card = cards[list[p]];
  const ratio = (p + 1) / list.length;
  scrub.style.setProperty("--pos", `${ratio * 100}%`);
  // the word itself stays out when it is set to stay hidden
  bubble.innerHTML = `${p + 1} <span class="w">/ ${list.length}</span>` +
    (filter === "all" ? "" : ` <span class="w">· No.${pad(card.n + 1)}</span>`) +
    (show.word ? ` · ${esc(card.key)}` : "");
  bubble.hidden = false;
  const width = scrub.clientWidth;
  const half = bubble.offsetWidth / 2;
  bubble.style.left = `${Math.max(half, Math.min(width - half, ratio * width))}px`;
}

function endScrub(jump) {
  const p = scrubbing;
  scrubbing = null;
  $("scrub").classList.remove("dragging");
  $("bubble").hidden = true;
  if (jump && p !== null && p !== cur) scrollToPos(p, false);
  else updateHud();
}

$("scrub").addEventListener("pointerdown", (e) => {
  if (!list.length || (e.pointerType === "mouse" && e.button !== 0)) return;
  e.preventDefault();
  $("scrub").setPointerCapture(e.pointerId);
  $("scrub").classList.add("dragging");
  scrubbing = scrubAt(e.clientX);
  paintScrub(scrubbing);
});

$("scrub").addEventListener("pointermove", (e) => {
  if (scrubbing === null) return;
  const p = scrubAt(e.clientX);
  if (p !== scrubbing) {
    scrubbing = p;
    paintScrub(p);
  }
});

$("scrub").addEventListener("pointerup", () => { if (scrubbing !== null) endScrub(true); });
$("scrub").addEventListener("pointercancel", () => { if (scrubbing !== null) endScrub(false); });
// released outside the window: the capture is lost without a pointerup
$("scrub").addEventListener("lostpointercapture", () => { if (scrubbing !== null) endScrub(true); });

window.addEventListener("resize", () => {
  requestAnimationFrame(() => { feed.scrollTop = cur * feed.clientHeight; });
});

/* ---------- speech ---------- */

// macOS lists joke voices (Bahh, Bells, Zarvox…) as en-US; never pick them
const NOVELTY_VOICE = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Eddy|Flo|Fred|Good News|Grandma|Grandpa|Hysterical|Jester|Junior|Kathy|Nicky|Organ|Pipe Organ|Princess|Ralph|Reed|Rocko|Sandy|Shelley|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/;
const PREFERRED_VOICES = [/^Samantha/, /^Google US English/, /^Alex$/, /^Microsoft (Aria|Jenny|Guy)/, /^(Ava|Allison|Susan|Tom|Zoe)\b/, /^Daniel/, /^Karen/, /^Google UK English/];
const PREFERRED_KO = [/^Yuna/, /^유나/, /^Google .*한국/, /^Nuri/, /^수진/];

let voices = [];
let voice = null;
let voiceName = store("vocab-voice") || "";
let koMissingNoted = false;
let utterGen = 0;
const mouths = { en: null, ko: null };

function log(...args) {
  console.log("[단어장]", ...args);
}

function voiceRank(v) {
  const i = PREFERRED_VOICES.findIndex((re) => re.test(v.name));
  return (i < 0 ? 50 : i) + (/^en[-_]US/i.test(v.lang) ? 0 : 0.5);
}

function rankedKo(all) {
  const ko = all.filter((v) => /^ko([-_]|$)/i.test(v.lang) && !NOVELTY_VOICE.test(v.name));
  ko.sort((a, b) => {
    const ra = PREFERRED_KO.findIndex((re) => re.test(a.name));
    const rb = PREFERRED_KO.findIndex((re) => re.test(b.name));
    return (ra < 0 ? 50 : ra) - (rb < 0 ? 50 : rb) || a.name.localeCompare(b.name);
  });
  return ko[0] || null;
}

function pickVoice() {
  const all = "speechSynthesis" in window ? speechSynthesis.getVoices() : [];
  voices = all
    .filter((v) => /^en([-_]|$)/i.test(v.lang) && !NOVELTY_VOICE.test(v.name))
    .sort((a, b) => voiceRank(a) - voiceRank(b) || a.name.localeCompare(b.name));
  voice = voices.find((v) => v.name === voiceName) || voices[0] || null;
}

function chooseVoice(win, lang) {
  let all = [];
  try { all = [...win.speechSynthesis.getVoices()]; } catch { return null; }
  if (lang === "ko") return rankedKo(all);
  return all.find((v) => v.name === voiceName && /^en([-_]|$)/i.test(v.lang))
    || all.filter((v) => /^en([-_]|$)/i.test(v.lang) && !NOVELTY_VOICE.test(v.name))
      .sort((a, b) => voiceRank(a) - voiceRank(b) || a.name.localeCompare(b.name))[0]
    || null;
}

// One speechSynthesis sticks to the first voice it used. Keep an English mouth
// and a Korean mouth, and never change the voice on either.
function mouth(lang) {
  if (mouths[lang]) return mouths[lang];
  const frame = document.createElement("iframe");
  frame.setAttribute("aria-hidden", "true");
  frame.tabIndex = -1;
  frame.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;border:0;pointer-events:none";
  document.body.appendChild(frame);
  const win = frame.contentWindow;
  win.speechSynthesis.getVoices();
  win.speechSynthesis.addEventListener?.("voiceschanged", () => win.speechSynthesis.getVoices());
  mouths[lang] = win;
  log("mouth", lang, "iframe 생성");
  return win;
}

function hush() {
  for (const lang of ["en", "ko"]) {
    const win = mouths[lang];
    if (!win) continue;
    try { win.speechSynthesis.cancel(); } catch { /* stopped */ }
  }
  try { speechSynthesis.cancel(); } catch { /* stopped */ }
}

function arm(lang) {
  const win = mouth(lang);
  const all = [...win.speechSynthesis.getVoices()];
  const v = chooseVoice(win, lang);
  const mine = all.filter((x) => (lang === "ko" ? /^ko([-_]|$)/i : /^en([-_]|$)/i).test(x.lang));
  log("arm", lang, {
    voices: all.length,
    matched: mine.length,
    picked: v ? `${v.name} / ${v.lang}` : null,
    names: mine.slice(0, 6).map((x) => `${x.name} / ${x.lang}`)
  });
}

function speak(text) {
  if (!("speechSynthesis" in window) || !text) return;
  if (autoplay) setAutoplay(false);
  const use = chooseVoice(window, "en");
  log("tap", use ? `${use.name} / ${use.lang}` : "기본", text.slice(0, 40));
  const u = new SpeechSynthesisUtterance(text);
  if (use) { u.voice = use; u.lang = use.lang; }
  else u.lang = "en-US";
  u.rate = 0.9;
  hush();
  if (speechSynthesis.paused) speechSynthesis.resume();
  speechSynthesis.speak(u);
}

// browsers refuse speech until the page has had a tap or key press
function canAutoPlay() {
  return !navigator.userActivation || navigator.userActivation.hasBeenActive;
}

function autoSpeak() {
  if (autoplay || !soundEnabled || cur >= list.length || !visible(cur, "word") || !canAutoPlay()) return;
  const n = list[cur];
  const signature = `${datasetFile}:${n}`;
  if (signature === lastSpoken) return;
  lastSpoken = signature;
  speak(cards[n].key);
}

function unlockSpeech(e) {
  if (!canAutoPlay()) return;
  for (const t of ["pointerup", "keydown"]) window.removeEventListener(t, unlockSpeech, true);
  // a tap on something that speaks by itself should not be talked over
  if (e.type === "keydown" && String(e.key).toLowerCase() === "p") return;
  if (e.target.closest && e.target.closest("[data-say], #speakBtn, #playBtn, .sheet, .scrub")) return;
  autoSpeak();
}

for (const t of ["pointerup", "keydown"]) window.addEventListener(t, unlockSpeech, true);

if ("speechSynthesis" in window) {
  pickVoice();
  mouth("en");
  mouth("ko");
  speechSynthesis.addEventListener?.("voiceschanged", () => {
    pickVoice();
    if (app.classList.contains("sheet-open")) paintVoices();
  });
  // Chrome pauses speechSynthesis after ~15s; autoplay reads longer than that
  setInterval(() => {
    if (!autoplay) return;
    for (const lang of ["en", "ko"]) {
      const synth = mouths[lang]?.speechSynthesis;
      if (synth?.paused && synth.speaking) synth.resume();
    }
  }, 8000);
}

/* ---------- autoplay ---------- */

function wordMeans(card) {
  const own = card.phrases.filter((ph) => ph.phrase === card.key);
  const source = own.some((ph) => ph.means.length) ? own : card.phrases;
  const means = [];
  for (const ph of source) for (const m of ph.means) if (m && !means.includes(m)) means.push(m);
  return means;
}

function playCues(card) {
  const cues = [];
  const repeat = (text, lang, anchor, n) => {
    for (let i = 0; i < n; i++) cues.push({ text, lang, anchor });
  };
  if (playWordMean) {
    const gloss = wordMeans(card).join(", ");
    if (gloss) cues.push({ text: gloss, lang: "ko", anchor: "mean" });
  }
  if (card.key) repeat(card.key, "en", card.key, wordRepeat);
  const seen = new Set();
  for (const ph of card.phrases) for (const ex of ph.ex) {
    if (!ex.s || seen.has(ex.s)) continue;
    seen.add(ex.s);
    if (playExMean && ex.m) cues.push({ text: ex.m, lang: "ko", anchor: ex.s });
    repeat(ex.s, "en", ex.s, exRepeat);
  }
  return cues;
}

function expose(p) {
  const old = peekAt;
  peek = new Set(["word", "ex"]);
  if (playWordMean) peek.add("mean");
  peekAt = p;
  if (old >= 0 && old !== p && rendered.has(old)) renderSlide(old);
  renderSlide(p);
}

function follow(p, cue) {
  const slide = feed.children[p];
  const body = slide && slide.querySelector(".body");
  if (!body) return;
  const el = cue.anchor === "mean"
    ? slide.querySelector(".mean")
    : [...slide.querySelectorAll("[data-say]")].find((n) => n.dataset.say === cue.anchor);
  if (!el) return;
  const top = el.getBoundingClientRect().top - body.getBoundingClientRect().top;
  if (top < 0 || top > body.clientHeight - 48) body.scrollTop += top - 24;
}

function utter(text, lang, done) {
  const gen = utterGen;
  const win = mouth(lang);
  const synth = win.speechSynthesis;
  if (gen !== utterGen || !autoplay) {
    log("skip", lang, { gen, utterGen, autoplay });
    return;
  }
  const use = chooseVoice(win, lang);
  log("speak", lang, use ? `${use.name} / ${use.lang}` : "목소리 없음", text.slice(0, 50), {
    speaking: synth.speaking, pending: synth.pending, paused: synth.paused
  });
  if (lang === "ko" && !use && !koMissingNoted) {
    koMissingNoted = true;
    toast("한국어 목소리가 없어 뜻을 못 읽어요");
  }
  const u = new win.SpeechSynthesisUtterance(text);
  if (use) {
    u.voice = use;
    u.lang = use.lang;
  } else u.lang = lang === "ko" ? "ko-KR" : "en-US";
  u.rate = lang === "ko" ? 1 : 0.9;
  let once = false;
  const fin = () => { if (once) return; once = true; clearTimeout(cap); done(); };
  const cap = setTimeout(fin, 4000 + text.length * 130);
  u.onstart = () => log("start", lang, text.slice(0, 40));
  u.onend = () => { log("end", lang, text.slice(0, 40)); fin(); };
  u.onerror = (ev) => {
    log("error", lang, ev.error || "unknown", text.slice(0, 40));
    if (ev.error === "interrupted" || ev.error === "canceled") return;
    if (lang === "ko" && ev.error === "not-allowed" && !koMissingNoted) {
      koMissingNoted = true;
      toast("한국어 목소리를 재생하지 못했어요");
    }
    fin();
  };
  if (synth.paused) synth.resume();
  synth.speak(u);
  setTimeout(() => log("after", lang, { speaking: synth.speaking, pending: synth.pending, paused: synth.paused }), 0);
}

function paintPlay() {
  playBtn.setAttribute("aria-pressed", autoplay ? "true" : "false");
  playBtn.setAttribute("aria-label", autoplay ? "자동 재생 정지" : "자동 재생");
  playBtn.querySelector(".lbl").textContent = autoplay ? "정지" : "재생";
}

function setAutoplay(on) {
  if (!on) {
    if (!autoplay) return;
    autoplay = false;
    playToken++;
    utterGen++;
    playDriven = false;
    paintPlay();
    hush();
    return;
  }
  if (!("speechSynthesis" in window)) { toast("이 브라우저는 음성을 지원하지 않아요"); return; }
  if (!list.length) return;
  autoplay = true;
  paintPlay();
  beginPlay(cur < list.length ? cur : 0);
}

function beginPlay(p) {
  const start = () => {
    if (!autoplay) return;
    arm("en");
    arm("ko");
    if (p !== cur) {
      playDriven = true;
      scrollToPos(p, false);
    }
    speakLines(p);
  };
  const busy = ["en", "ko"].some((lang) => {
    const synth = mouths[lang]?.speechSynthesis;
    return synth && (synth.speaking || synth.pending);
  }) || speechSynthesis.speaking || speechSynthesis.pending;
  log("begin", { card: p, busy });
  if (!busy) { start(); return; }
  hush();
  setTimeout(start, 120);
}

function advancePlay(p) {
  if (!autoplay) return;
  const n = p + 1;
  if (n >= list.length) {
    setAutoplay(false);
    playDriven = true;
    scrollToPos(list.length, false);
    toast("끝까지 재생했어요");
    return;
  }
  playDriven = true;
  scrollToPos(n, false);
  speakLines(n);
}

function replayPlay() {
  if (!autoplay || cur >= list.length) return;
  playToken++;
  utterGen++;
  beginPlay(cur);
}

function speakLines(p) {
  if (!autoplay || p < 0 || p >= list.length) return;
  const card = cards[list[p]];
  if (!card) return;
  const token = ++playToken;
  utterGen++;
  const cues = playCues(card);
  expose(p);
  let i = 0;
  const stepCue = () => {
    if (token !== playToken || !autoplay) return;
    if (i >= cues.length) { advancePlay(p); return; }
    const cue = cues[i++];
    const next = cues[i];
    const gap = !next ? 650 : next.text === cue.text ? 280 : 420;
    follow(p, cue);
    utter(cue.text, cue.lang, () => setTimeout(stepCue, gap));
  };
  stepCue();
}

/* ---------- actions ---------- */

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1400);
}

function bump(btn) {
  btn.classList.remove("bump");
  void btn.offsetWidth;
  btn.classList.add("bump");
}

function setFlag(kind, value) {
  if (cur >= list.length) return;
  const n = list[cur];
  const bits = kind === "learned" ? learned : marked;
  if (bits[n] === value) return;
  bits[n] = value;
  saveBits(kind === "learned" ? MASTERED_PREFIX : BOOKMARK_PREFIX, bits);
  const tags = feed.children[cur]?.querySelector(".tags");
  if (tags) tags.innerHTML = tagsHTML(n);
  updateHud();
  bump(kind === "learned" ? learnBtn : markBtn);
  if (kind === "learned") toast(value ? "외운 단어로 표시했어요" : "외움 표시를 지웠어요");
  else toast(value ? "북마크에 담았어요" : "북마크를 해제했어요");
}

function popAt(x, y) {
  const el = $("pop");
  const box = app.getBoundingClientRect();
  el.style.left = `${x - box.left}px`;
  el.style.top = `${y - box.top}px`;
  el.classList.remove("go");
  void el.offsetWidth;
  el.classList.add("go");
}

function reveal(p, field) {
  if (peekAt !== p) {
    const old = peekAt;
    peek = new Set();
    peekAt = p;
    if (old >= 0 && rendered.has(old)) renderSlide(old);
  }
  peek.add(field);
  renderSlide(p);
  if (field === "word" && p === cur) autoSpeak();
}

learnBtn.addEventListener("click", () => setFlag("learned", !learned[list[cur]]));
markBtn.addEventListener("click", () => setFlag("marked", !marked[list[cur]]));
speakBtn.addEventListener("click", () => {
  if (cur < list.length) speak(cards[list[cur]].key);
});
playBtn.addEventListener("click", () => setAutoplay(!autoplay));

feed.addEventListener("click", (e) => {
  const r = e.target.closest("[data-reveal]");
  if (r) {
    reveal(Number(r.closest(".slide").dataset.p), r.dataset.reveal);
    return;
  }
  const say = e.target.closest("[data-say]");
  if (say) {
    speak(say.dataset.say);
    return;
  }
  const act = e.target.closest("[data-act]");
  if (act && act.dataset.act === "top") scrollToPos(0, false);
  if (act && act.dataset.act === "all") setFilter("all");
  if (act && act.dataset.act === "sheet") openSheet();
});

// double tap on the post = bookmark (never un-bookmarks, like a "like")
feed.addEventListener("pointerup", (e) => {
  if (e.button !== 0 || e.target.closest("button, a, input")) return;
  const now = performance.now();
  if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
    lastTap.t = 0;
    if (cur >= list.length) return;
    setFlag("marked", true);
    popAt(e.clientX, e.clientY);
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
});

document.addEventListener("keydown", (e) => {
  if (app.classList.contains("sheet-open")) {
    if (e.key === "Escape") closeSheet();
    return;
  }
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (["ArrowDown", "ArrowRight", "PageDown", " ", "j"].includes(key)) { e.preventDefault(); step(1); }
  else if (["ArrowUp", "ArrowLeft", "PageUp", "k"].includes(key)) { e.preventDefault(); step(-1); }
  else if (key === "Home") { e.preventDefault(); scrollToPos(0, false); }
  else if (key === "End") { e.preventDefault(); scrollToPos(Math.max(0, list.length - 1), false); }
  else if (key === "m") learnBtn.click();
  else if (key === "b") markBtn.click();
  else if (key === "s") speakBtn.click();
  else if (key === "p") playBtn.click();
  else if (key === ",") openSheet();
});

/* ---------- settings ---------- */

function segHTML(options, value) {
  return options.map((o) =>
    `<button type="button" data-value="${o.value}" aria-pressed="${o.value === value}">${o.label}</button>`
  ).join("");
}

function paintSheet() {
  $("segData").innerHTML = segHTML(DATA_FILES.map((d) => ({ value: d.file, label: d.label })), datasetFile);
  $("segFilter").innerHTML = segHTML(FILTERS, filter);
  $("segSound").innerHTML = segHTML([{ value: "on", label: "켜기" }, { value: "off", label: "끄기" }], soundEnabled ? "on" : "off");
  $("segWordMean").innerHTML = segHTML([{ value: "on", label: "켜기" }, { value: "off", label: "끄기" }], playWordMean ? "on" : "off");
  $("segExMean").innerHTML = segHTML([{ value: "on", label: "켜기" }, { value: "off", label: "끄기" }], playExMean ? "on" : "off");
  const repeatOpts = [1, 2, 3, 4, 5].map((n) => ({ value: String(n), label: String(n) }));
  $("segWordN").innerHTML = segHTML(repeatOpts, String(wordRepeat));
  $("segExN").innerHTML = segHTML(repeatOpts, String(exRepeat));
  $("segTheme").innerHTML = segHTML(THEMES, theme);
  $("chipsShow").innerHTML = FIELDS.map((f) =>
    `<button type="button" data-value="${f}" aria-pressed="${show[f]}">${LABELS[f]}</button>`
  ).join("");
  const nLearned = learned.filter(Boolean).length;
  const nMarked = marked.filter(Boolean).length;
  $("stats").innerHTML = cards.length
    ? `외움 <b>${nLearned}</b> / ${cards.length} · 북마크 <b>${nMarked}</b>`
    : "";
  $("jumpInput").max = String(cards.length || 1);
  paintVoices();
}

function paintVoices() {
  const select = $("voiceSelect");
  select.innerHTML = voices.length
    ? voices.map((v) => `<option value="${esc(v.name)}">${esc(v.name)} · ${esc(v.lang)}</option>`).join("")
    : '<option value="">기본 목소리</option>';
  select.value = voice ? voice.name : "";
}

function openSheet() {
  paintSheet();
  sheetReturn = document.activeElement;
  app.classList.add("sheet-open");
  $("sheet").inert = false;
  feed.inert = $("rail").inert = true;
  $("closeSheet").focus({ preventScroll: true });
}

function closeSheet() {
  app.classList.remove("sheet-open");
  $("sheet").inert = true;
  feed.inert = $("rail").inert = false;
  if (sheetReturn && sheetReturn.focus) sheetReturn.focus({ preventScroll: true });
}

function currentN() {
  if (cur < list.length) return list[cur];
  // an empty filter result has only the end slide: keep the word we came from
  return list.length ? cards.length : lastN;
}

function setFilter(value) {
  filter = value;
  store("vocab-filter", value);
  build(currentN());
}

function applyTheme() {
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  document.querySelector('meta[name="theme-color"]').content = bg;
}

function seg(id, handler) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("[data-value]");
    if (!b) return;
    handler(b.dataset.value);
    paintSheet();
  });
}

seg("segData", (file) => { if (file !== datasetFile) loadDataset(file); });
seg("segFilter", (value) => { if (value !== filter) setFilter(value); });
seg("segSound", (value) => {
  soundEnabled = value === "on";
  store("vocab-sound-enabled", String(soundEnabled));
  if (!soundEnabled && "speechSynthesis" in window) hush();
  lastSpoken = "";
  autoSpeak();
});
function savePlay(key, value) {
  store(key, String(value));
  replayPlay();
}
seg("segWordMean", (value) => {
  const on = value === "on";
  if (on === playWordMean) return;
  playWordMean = on;
  savePlay("vocab-play-word-mean", on);
});
seg("segExMean", (value) => {
  const on = value === "on";
  if (on === playExMean) return;
  playExMean = on;
  savePlay("vocab-play-ex-mean", on);
});
seg("segWordN", (value) => {
  const n = Number(value);
  if (n === wordRepeat) return;
  wordRepeat = n;
  savePlay("vocab-play-word-n", n);
});
seg("segExN", (value) => {
  const n = Number(value);
  if (n === exRepeat) return;
  exRepeat = n;
  savePlay("vocab-play-ex-n", n);
});
$("voiceSelect").addEventListener("change", (e) => {
  voiceName = e.target.value;
  store("vocab-voice", voiceName);
  pickVoice();
  $("voiceTest").click();
});
$("voiceTest").addEventListener("click", () => {
  speak(cur < list.length ? cards[list[cur]].key : "Hello");
});
seg("segTheme", (value) => {
  theme = value;
  store("vocab-theme", value);
  applyTheme();
});
seg("chipsShow", (field) => {
  show[field] = !show[field];
  store("vocab-show", JSON.stringify(show));
  for (const p of rendered) renderSlide(p);
});

$("jumpForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = Number($("jumpInput").value);
  if (!Number.isInteger(v) || v < 1 || !cards.length) return;
  const target = Math.min(v, cards.length) - 1;
  let p = list.findIndex((n) => n >= target);
  if (p < 0) p = list.length;
  $("jumpInput").value = "";
  closeSheet();
  scrollToPos(p, false);
  if (list[p] !== target && p < list.length) toast(`No.${pad(target + 1)}은 목록에 없어 다음 단어로 왔어요`);
});

$("setBtn").addEventListener("click", openSheet);
$("closeSheet").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);

/* ---------- loading ---------- */

async function loadDataset(file) {
  if (autoplay) setAutoplay(false);
  datasetFile = file;
  store("vocab-dataset", file);
  cards = [];
  learned = [];
  marked = [];
  message("불러오는 중…");
  let data;
  try {
    const res = await fetch(`./data/${file}`, { cache: "no-store" });
    if (!res.ok) throw new Error(String(res.status));
    data = await res.json();
    if (!Array.isArray(data)) throw new Error("not array");
  } catch {
    if (file === datasetFile) message(`${datasetLabel()}을 불러오지 못했어요`, "파일로 직접 열었다면 python3 -m http.server 로 띄워서 열어 주세요.");
    return;
  }
  if (file !== datasetFile) return;
  cards = data.map(normalizeCard).filter(Boolean);
  cards.forEach((c, n) => { c.n = n; });
  learned = loadBits(MASTERED_PREFIX);
  marked = loadBits(BOOKMARK_PREFIX);
  let saved = store(`vocab-i-${datasetName()}`);
  if (saved === null && file === legacy.file) saved = legacy.i;
  const n = Number(saved);
  build(Number.isInteger(n) && n >= 0 ? Math.min(n, cards.length) : 0);
  if (app.classList.contains("sheet-open")) paintSheet();
}

applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
loadDataset(DATA_FILES.some((d) => d.file === legacy.file) ? legacy.file : DATA_FILES[0].file);
</script>
</body>
